# Accepted-risk suppressions for CVEs baked into vendored lint/format CLI binaries.
#
# yamlfmt and dockerfmt are downloaded as prebuilt release binaries (already pinned
# to latest upstream) and markdownlint-cli2 via bun; all three only ever run locally
# during `make fmt`/CI on our own repo files. None act as a TLS/HTTP server, parse
# untrusted network/DNS/email/XML input, or read TOML config in this repo. Renovate
# keeps these pinned versions current, so these entries become no-ops once upstream
# ships a rebuild against patched Go stdlib/deps. Revisit at expired_at.
vulnerabilities:
  # --- shared: Go stdlib/x-net CVEs baked into both the yamlfmt and dockerfmt binaries ---
  - id: CVE-2026-56862 # crypto/tls: DoS via indefinite KeyUpdate messages
    statement: "yamlfmt/dockerfmt: Go stdlib CVE; not used as a TLS server/client."
    expired_at: 2027-10-01
  - id: CVE-2026-56860 # net/url: DoS via quadratic complexity in path resolution
    statement: "yamlfmt/dockerfmt: Go stdlib CVE; never parses untrusted URLs."
    expired_at: 2027-10-01
  - id: CVE-2026-56859 # encoding/xml: DoS via XML decoding recursion depth
    statement: "yamlfmt/dockerfmt: Go stdlib CVE; never decodes untrusted XML."
    expired_at: 2027-10-01
  - id: CVE-2026-56858 # html/template: XSS via pathological input
    statement: "yamlfmt/dockerfmt: Go stdlib CVE; tool renders no HTML templates."
    expired_at: 2027-10-01
  - id: CVE-2026-56853 # net/http: unencrypted HTTP/2 connections vulnerable to DoS
    statement: "yamlfmt/dockerfmt: Go stdlib CVE; not used as an HTTP server."
